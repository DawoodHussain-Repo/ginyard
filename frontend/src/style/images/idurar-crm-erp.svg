<svg width="400" height="120" viewBox="0 0 400 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c5ce7" />
      <stop offset="100%" stop-color="#00cec9" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d3436" />
      <stop offset="100%" stop-color="#6c5ce7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Icon -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="90" height="90" rx="24" fill="url(#primaryGradient)" />
    <!-- Ledger L + Sparkle -->
    <path d="M 28 24 V 66 H 62" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- AI Sparkle Node -->
    <circle cx="62" cy="28" r="6" fill="#FFFFFF" filter="url(#glow)" />
    <path d="M 62 16 V 40 M 50 28 H 74" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Typography -->
  <text x="120" y="62" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="40" fill="url(#textGradient)" letter-spacing="-1">
    Ledgerly<tspan fill="#6c5ce7">.ai</tspan>
  </text>
  <text x="122" y="86" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="14" fill="#a29bfe" letter-spacing="2">
    AI-NATIVE ACCOUNTING
  </text>
</svg>